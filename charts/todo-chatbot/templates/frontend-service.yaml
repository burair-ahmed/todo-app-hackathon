apiVersion: v1
kind: Service
metadata:
  name: todo-frontend-svc
  labels:
    app: todo-frontend-svc
spec:
  selector:
    app: todo-frontend
  ports:
    - protocol: TCP
      port: {{ .Values.frontend.service.port }}
      targetPort: 3000
      name: http
  type: {{ .Values.frontend.service.type }}